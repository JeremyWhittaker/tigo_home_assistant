[project]
name = "tigo-home-assistant"
version = "0.2.1"
description = "Unofficial read-only Tigo Energy Cloud integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Jeremy Whittaker" }]
dependencies = ["aiohttp>=3.9.0"]

[project.optional-dependencies]
test = [
  "pytest-homeassistant-custom-component==0.13.205",
  "ruff>=0.16.0,<0.17.0",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
